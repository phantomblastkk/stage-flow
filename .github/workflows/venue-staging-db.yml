name: Stage Flow • Isolated venue DB QA

on:
  push:
    branches: [develop]
    paths:
      - "supabase/venue_*.sql"
      - "supabase/venues_*.sql"
      - "supabase/schema.sql"
      - "tests/homologation/**"
      - "tests/sql/venue-partner-isolation.sql"
      - ".github/workflows/venue-staging-db.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-flow-venue-db-qa-develop
  cancel-in-progress: true

jobs:
  isolated-postgres:
    name: Venue SQL integration (temporary database, no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-qa-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: local-qa-fixture-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Apply isolated schema and Stage Flow venue migrations
        run: |
          set -euo pipefail
          for sql in \
            tests/homologation/postgres-shim.sql \
            supabase/schema.sql \
            supabase/venues_catalog_migration.sql \
            supabase/venues_catalog_contributions.sql \
            supabase/venues_deduplication_migration.sql \
            supabase/venue_admin_migration.sql \
            supabase/venue_calendar_gallery_suggestions_migration.sql \
            supabase/venue_partner_management_migration.sql \
            tests/homologation/enable-fixtures-on-qa.sql \
            tests/homologation/seed-venues.sql \
            tests/homologation/fake-accounts.sql; do
            echo "Checking $sql"
            psql -X -v ON_ERROR_STOP=1 -f "$sql"
          done
      - name: Verify public venue fixtures and isolated calendars
        run: psql -X -v ON_ERROR_STOP=1 -f tests/homologation/verify-venues.sql
      - name: Verify partner cannot cross venues or promote permissions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/venue-partner-isolation.sql
