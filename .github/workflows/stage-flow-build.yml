name: Stage Flow • Integration and build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "src/**"
      - "lib/**"
      - "middleware.ts"
      - "next.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "tests/**"
      - "supabase/venue_*.sql"
      - "supabase/account_*.sql"
      - "supabase/stage_owner_admin_hub_migration.sql"
      - "supabase/stage_workspace_*.sql"
      - "vercel.json"
      - ".github/workflows/stage-flow-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-flow-build-main
  cancel-in-progress: true

jobs:
  validate:
    name: Compile and integration validation (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "build-time-placeholder-not-a-real-secret"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify venue authorization contracts
        run: npm run test:venue-security
      - name: Verify show history and finance isolation
        run: npm run test:show-history
      - name: Verify chat and finance contracts
        run: npm run test:chat-finance
      - name: Verify hiring proposal permissions
        run: npm run test:hiring-proposals
      - name: Verify musician calendar and conflicts
        run: npm run test:musician-availability
      - name: Verify recurring show drafts and team invitations
        run: npm run test:recurring-shows
      - name: Verify show roster and audited replacements
        run: npm run test:show-team-lineup
      - name: Verify internal notifications and recipient isolation
        run: npm run test:notifications
      - name: Verify show operations and participant briefing
        run: npm run test:show-operations
      - name: Verify show briefing notifications and isolation
        run: npm run test:show-operations-alerts
      - name: Verify Asaas webhook safety contracts
        run: node --test tests/asaas-contract.test.mjs
      - name: Verify account roles, profiles and 60-day name guard
        run: node --test tests/account-identity-dual-roles.test.mjs
      - name: Verify canonical singer Pro-style profile and manual deployments
        run: node --test tests/singer-public-site.test.mjs
      - name: Verify owner-only admin, venue approvals and badges
        run: node --test tests/owner-admin-hub.test.mjs
      - name: Verify new SaaS navigation, dashboard, security, mobile UI and SEO contracts
        run: node --test tests/workspace-saas.test.mjs tests/workspace-saas-part2.test.mjs tests/workspace-navigation-routes.test.mjs tests/home-pro-notifications.test.mjs tests/artist-booking-musician-refresh.test.mjs
      - name: Verify shared accounts and agenda/finance services through PostgREST request builder
        run: node --test tests/account-store.test.mjs tests/booking-service.test.mjs tests/negotiation-service.test.mjs tests/agenda-service.test.mjs tests/finance-service.test.mjs tests/finance-report.test.mjs
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build Next.js
        run: npm run build
      - name: Install Chromium for mobile regression
        run: npx playwright install --with-deps chromium --only-shell
      - name: Verify agenda and finance in browser (synthetic API only)
        run: npm run test:agenda-mobile
      - name: Attach browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-finance-browser-evidence
          path: test-results/
          retention-days: 7
